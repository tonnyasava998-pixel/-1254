<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Keep this page out of search-engine results -->
    <meta name="robots" content="noindex, nofollow, noarchive">

    <title>Tonny Asava</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #1d1d1f;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 18px;
            padding: 48px 32px;
            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .initials {
            width: 72px;
            height: 72px;
            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: #1d1d1f;
            color: white;

            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        h1 {
            margin: 0;
            font-size: 27px;
            font-weight: 600;
        }

        .subtitle {
            margin: 8px 0 32px;
            font-size: 14px;
            color: #777;
        }

        .details {
            border-top: 1px solid #eeeeee;
        }

        .detail {
            padding: 18px 5px;
            border-bottom: 1px solid #eeeeee;
        }

        .label {
            display: block;
            margin-bottom: 6px;

            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1.2px;

            color: #999;
        }

        .value {
            font-size: 16px;
            color: #222;
            text-decoration: none;
        }

        .value:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 28px;
            font-size: 11px;
            color: #aaa;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 40px 22px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="initials">
            TA
        </div>

        <h1>Tonny Asava</h1>

        <p class="subtitle">
            Contact Information
        </p>

        <div class="details">

            <div class="detail">
                <span class="label">PHONE</span>

                <a class="value"
                   href="tel:+254110708384">
                    +254 110 708 384
                </a>
            </div>

            <div class="detail">
                <span class="label">EMAIL</span>

                <a class="value"
                   href="mailto:writertimes70@gmail.com">
                    writertimes70@gmail.com
                </a>
            </div>

        </div>

        <div class="footer">
            Tap a detail to connect
        </div>

    </main>

</body>
</html>
